name: Build and Release DevDeck

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact_name: DevDeck-linux-x86_64.tar.gz
          - os: windows-latest
            arch: x64
            artifact_name: DevDeck-windows-x64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Generate Windows Icon
        if: runner.os == 'Windows'
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('assets/icon.ico', format='ICO', sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller devdeck.spec --clean --noconfirm

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/DevDeck
          cp devdeck.desktop dist/
          cp assets/icon.png dist/
          tar -czvf ${{ matrix.artifact_name }} -C dist DevDeck devdeck.desktop icon.png

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/DevDeck.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Inspect Downloaded Artifacts
        run: |
          ls -lh release_assets/

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify Tag Matches version.py
        run: |
          # A release must not ship a version string that disagrees with the
          # source of truth, so fail the build rather than publish a mismatch.
          FILE_VERSION=$(python3 -c "import version; print(version.__version__)")
          TAG_VERSION="${{ steps.vars.outputs.tag }}" | sed 's/^v//'
          echo "version.py = $FILE_VERSION"
          echo "tag        = $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match version.py ($FILE_VERSION)."
            exit 1
          fi

      - name: Extract Changelog for Tag
        id: notes
        run: |
          # Prefer the hand-written CHANGELOG entry for this tag. Fall back to
          # GitHub's generated notes if the changelog has no section for it.
          VERSION="${{ steps.vars.outputs.tag }}" | sed 's/^v//'
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v ver="$VERSION" '
              $0 ~ "^## \\["ver"\\]" { found=1; next }
              found && /^## \\[/ { exit }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d')
          fi
          if [ -n "${NOTES:-}" ]; then
            printf '%s\n' "$NOTES" > release_notes.md
            echo "using=changelog" >> $GITHUB_OUTPUT
          else
            echo "using=generated" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: DevDeck ${{ steps.vars.outputs.tag }}
          body_path: ${{ steps.notes.outputs.using == 'changelog' && 'release_notes.md' || '' }}
          files: release_assets/*
          generate_release_notes: ${{ steps.notes.outputs.using == 'generated' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
